<!DOCTYPE html>
<html>
<head>
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>
<body class="body">
  <div class="info-wrapper">
    <img class="info-wrapper__logo" src="./eisenhower-matrix.jpg">
    <a class="info-wrapper__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
  </div>
  <div class="main-wrapper">
    <p>
    <label class="main-wrapper__label" for="new-task">Add Item</label>
    <div class="main-wrapper__new-task">
      <input class="main-wrapper__new-task-input" id="new-task" type="text">
      <button class="main-wrapper__new-task-button">Add</button>
    </div>
    </p>
    <h3 class="main-wrapper__title">Todo</h3>
    <ul class="todo-list incomplete-tasks-list">
      <li class="todo-list__li incomplete-tasks-list__li">
        <input class="todo-list__checkbox" type="checkbox">
        <label class="todo-list__label">Pay Bills</label>
        <input type="text" class="todo-list__input">
        <button class="todo-list__button_edit">Edit</button>
        <button class="todo-list__button_delete"><img class="todo-list__button_delete-image" src="./remove.svg"></button>
      </li>
      <li class="todo-list__li incomplete-tasks-list__li_edit">
        <input class="todo-list__checkbox" type="checkbox">
        <label class="todo-list__label-shoping">Go Shopping</label>
        <input class="todo-list__input-shoping" type="text" value="Go Shopping">
        <button class="todo-list__button_edit">Save</button>
        <button class="todo-list__button_delete">
          <img class="todo-list__button_delete-image" src="./remove.svg">
        </button>
      </li>
    </ul>
    <h3 class="main-wrapper__title">Completed</h3>
    <ul class="todo-list completed-tasks-list">
      <li class="todo-list__li completed-tasks-list__li">
        <input class="todo-list__checkbox" type="checkbox" checked>
        <label class="todo-list__label completed__label">See the Doctor</label>
        <input class="todo-list__input" type="text">
        <button class="todo-list__button_edit">Edit</button>
        <button class="todo-list__button_delete">
          <img class="todo-list__button_delete-image" src="./remove.svg">
        </button>
      </li>
    </ul>
  </div>
  <script src="app.js"></script>
</body>
</html>
